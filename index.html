<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGWEB ACARA 5 | GEOJSON</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // 1. Inisialisasi peta
        var map = L.map("map").setView([-8.341896, 122.987972], 11);

        // 2. Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });
        basemap.addTo(map);

        // 3. GeoJSON Point Sarana Prasarana (Toponimi)
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "image/home_marker.png",
                        iconSize: [20, 20],
                        iconAnchor: [15, 30],
                        popupAnchor: [0, -30],
                        tooltipAnchor: [-15, -15],
                    }),
                });
            },
            onEachFeature: function (feature, layer) {
                // Cek data di Console F12 browser untuk melihat nama properti sebenarnya
                console.log("Data Poin:", feature.properties);

                // Ambil nama gambar dari GeoJSON, jika tidak ada/undefined pakai 'gunung-ile-lewero.jpg'
                var namaFileGambar = feature.properties.image || "gunung-ile-lewero.jpg";

                // Bikin konten Popup (ditambah onerror jika gambar lokal gagal dipanggil)
                var popup_content = `
                <div style="text-align: center;">
                    <b>Nama:</b> ${feature.properties.TOPONIMI || '-'}<br>
                    <b>Koordinat:</b> ${feature.geometry.coordinates[1]}, ${feature.geometry.coordinates[0]}<br><br>
                    <img src="image/${namaFileGambar}" alt="Gambar Toponimi" width="180" style="border-radius: 6px;"
                         onerror="this.onerror=null; this.src='https://placehold.co/180x120?text=Gambar+Tidak+Ditemukan';">
                </div>
            `;

                // Bind popup langsung ke layer poin ini
                layer.bindPopup(popup_content);

                layer.on({
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        // 4. GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            style: function (feature) {
                return {
                    color: "#2d6cdf",
                    weight: 2,
                    opacity: 0.8,
                };
            },
            onEachFeature: function (feature, layer) {
                var fungsiJalan = feature.properties.NAMA_UNSUR || "Jalan";
                var panjangKm = feature.properties.panjang_km ||
                    (feature.properties.panjang_m ? (feature.properties.panjang_m / 1000).toFixed(3) : null) ||
                    "-";

                var popup_content = "Fungsi: " + fungsiJalan + "<br>" +
                    "Panjang (km): " + panjangKm;

                layer.bindPopup(popup_content);

                layer.on({
                    mouseover: function (e) {
                        layer.bringToFront();
                        layer.bindTooltip(fungsiJalan, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        // 5. GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            style: function (feature) {
                return {
                    color: "gray",
                    opacity: 1,
                    weight: 1,
                    fillColor: "#a9a9a9",
                    fillOpacity: 0.4,
                };
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "Kecamatan: " + feature.properties.WADMKC + "<br>" +
                    "Jumlah Penduduk: " + feature.properties.penduduk;

                layer.bindPopup(popup_content);

                layer.on({
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.WADMKC, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        // Load Data GeoJSON
        // Mengunduh semua file GeoJSON sekaligus dan mengatur hirarki tumpukannya
        $.when(
            $.getJSON("geojson/jumlah_penduduk.geojson"),
            $.getJSON("geojson/jalan.geojson"),
            $.getJSON("geojson/toponimi.geojson")
        ).done(function (resPenduduk, resJalan, resToponimi) {
            // 1. Tambahkan Poligon TERLEBIH DAHULU (Paling Bawah)
            jumlah_penduduk.addData(resPenduduk[0]);
            map.addLayer(jumlah_penduduk);

            // 2. Tambahkan Jalan DI ATAS Poligon (Tengah)
            jalan.addData(resJalan[0]);
            map.addLayer(jalan);

            // 3. Tambahkan Titik Toponimi di PALING ATAS
            toponimi.addData(resToponimi[0]);
            map.addLayer(toponimi);
        });
        // Control Layer (Perbaikan variabel basemap)
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            "Jalan": jalan,
            "Toponimi": toponimi,
            "Jumlah Penduduk": jumlah_penduduk
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);
    </script>
</body>

</html>
